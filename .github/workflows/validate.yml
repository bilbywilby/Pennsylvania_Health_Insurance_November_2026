name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate derived files
        run: |
          python3 scripts/calc_audit.py > /dev/null
          python3 scripts/build_area_tables.py
          python3 scripts/generate_handover.py
      - name: Derived files must be committed and current
        run: git diff --exit-code
      - name: Validate packet
        run: python3 scripts/validate_packet.py
      - name: Provenance gate
        run: python3 scripts/06_provenance_gate.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
